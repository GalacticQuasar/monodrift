<title>Monodrift Update Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one narrow column, like the game's white road; pixel display face for headings, plain grey palette from the game */
:root {
  --ground: #e8e8e8; --road: #ffffff; --ink: #111111; --muted: #5e5e5e; --line: #cfcfcf; --tag: #111111; --tag-ink: #ffffff;
  --display: 'Silkscreen', ui-monospace, monospace; --body: 'Inter', -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #1b1b1b; --road: #262626; --ink: #f0f0f0; --muted: #a8a8a8; --line: #3a3a3a; --tag: #f0f0f0; --tag-ink: #111111; color-scheme: dark } }
:root[data-theme="dark"] { --ground: #1b1b1b; --road: #262626; --ink: #f0f0f0; --muted: #a8a8a8; --line: #3a3a3a; --tag: #f0f0f0; --tag-ink: #111111; color-scheme: dark }
body { background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 48px; }
main { max-width: 620px; margin: 0 auto; background: var(--road); border-radius: 14px; padding: 28px clamp(18px, 5vw, 36px) 32px; display: grid; gap: 26px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 7vw, 42px); line-height: 1.05; }
h2 { font-size: 17px; letter-spacing: 0.04em; }
.lead { margin: 6px 0 0; color: var(--muted); }
.play { display: inline-block; margin-top: 14px; font-weight: 600; color: var(--tag-ink); background: var(--tag); padding: 9px 16px; border-radius: 18px; text-decoration: none; }
.play:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
img { display: block; width: 100%; border-radius: 10px; border: 1px solid var(--line); }
section { display: grid; gap: 10px; }
ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
li { padding-left: 18px; position: relative; }
li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 6px; height: 6px; background: var(--ink); }
li b { font-weight: 600; }
</style>
<main>
  <header>
    <h1>Monodrift</h1>
    <p class="lead">A minimal top-down drift game. Stay on the road; the car speeds up the longer you survive. {{INTRO}}</p>
    <a class="play" href="https://monodrift.galacticquasar.dev">Play at monodrift.galacticquasar.dev</a>
  </header>
  <img src="data:image/jpeg;base64,{{IMAGE_BASE64}}" alt="A black car drifting around a bend on a white road between grey pixel-art trees">
{{SECTIONS}}
</main>
