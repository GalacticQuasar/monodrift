<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Monodrift</title>
    <meta name="description" content="A minimal top-down drift game. Stay on the road; the car speeds up the longer you survive." />
    <meta name="theme-color" content="#e8e8e8" />
    <script>
      // light/dark before first paint (same rule as src/ui/theme.ts, which takes over on load)
      (function () {
        var d = null;
        try {
          d = localStorage.getItem('monodrift-dark');
        } catch (e) {}
        if (d === 'on' || (d === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Monodrift" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://monodrift.galacticquasar.dev/" />
    <meta property="og:title" content="Monodrift" />
    <meta property="og:description" content="A minimal top-down drift game. Stay on the road; the car speeds up the longer you survive." />
    <meta property="og:image" content="https://monodrift.galacticquasar.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A black car drifting around a bend on a white road between grey pixel-art trees, with the title Monodrift." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="score"></div>
    <div id="msg"></div>
    <!-- touch devices show the icon, desktop the text (see style.css). Icons: pixelarticons
         (trophy, settings-cog), MIT, see src/icons/pixelarticons-LICENSE.txt -->
    <button id="lb" aria-label="Leaderboard"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 17H13V19H15V21H9V19H11V17H8V15H16V17ZM18 5H22V11H20V7H18V11H20V13H18V15H16V5H8V15H6V13H4V11H6V7H4V11H2V5H6V3H18V5Z" /></svg><span class="label">Leaderboard</span></button>
    <button id="settings-btn" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h3v-2h4v4h2v-4h4v2h-2v4H9v-4H7v2H2v-5h2v3Zm18 2h-5v-2h3v-3h2v5ZM6 11H2v2h4v4H4v-2H0V9h4V7h2v4Zm14-2h4v6h-4v2h-2v-4h4v-2h-4V7h2v2Zm-6 7h-4v-2h4v2Zm-4-2H8v-4h2v4Zm6 0h-2v-4h2v4Zm-2-4h-4V8h4v2ZM7 4H4v3H2V2h5v2Zm8 0h2V2h5v5h-2V4h-3v2h-4V2h-2v4H7V4h2V0h6v4Z" /></svg><span class="label">Settings</span></button>
    <div id="install" class="card" hidden></div>
    <div id="join" class="card" hidden></div>
    <div id="board" class="modal" hidden></div>
    <div id="settings" class="modal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
